<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria Huellitas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1>Veterinaria Huellitas</h1>
    <h2>Registro de mascotas</h2>

    <label for="nombre" class="form-label">Nombre:</label>
    <input id="nombre" type="text" class="form-control mb-3">

    <label for="especie" class="form-label">Especie:</label>
    <select id="especie" class="form-select mb-3">
      <option>Perro</option>
      <option>Gato</option>
    </select>

    <label for="edad" class="form-label">Edad:</label>
    <input id="edad" type="number" class="form-control mb-3">

    <button id="registrar" class="btn btn-primary mb-4">Registrar mascota</button>

    <ul id="lista" class="list-group"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
